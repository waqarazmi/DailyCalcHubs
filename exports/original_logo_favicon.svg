<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#glowBorder)" stroke-width="8" opacity="0.65"/>

  <!-- Inner Brand Badge -->
  <g filter="url(#glow)">
    <rect x="76" y="76" width="360" height="360" rx="72" fill="url(#brandGrad)"/>
  </g>

  <!-- Calculator Screen -->
  <rect x="126" y="126" width="260" height="72" rx="18" fill="#0b1329" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <circle cx="156" cy="162" r="8" fill="#38bdf8"/>
  <!-- Digital Segment Bar -->
  <rect x="180" y="154" width="180" height="16" rx="8" fill="#22c55e" opacity="0.9"/>

  <!-- Calculator Keypad Matrix (3x3 keys) -->
  <!-- Row 1 -->
  <rect x="126" y="228" width="68" height="52" rx="14" fill="#ffffff" opacity="0.95"/>
  <rect x="222" y="228" width="68" height="52" rx="14" fill="#ffffff" opacity="0.95"/>
  <rect x="318" y="228" width="68" height="52" rx="14" fill="#38bdf8"/>

  <!-- Row 2 -->
  <rect x="126" y="298" width="68" height="52" rx="14" fill="#ffffff" opacity="0.95"/>
  <rect x="222" y="298" width="68" height="52" rx="14" fill="#ffffff" opacity="0.95"/>
  <rect x="318" y="298" width="68" height="52" rx="14" fill="#38bdf8"/>

  <!-- Row 3 -->
  <rect x="126" y="368" width="164" height="52" rx="14" fill="#ffffff" opacity="0.95"/>
  <rect x="318" y="368" width="68" height="52" rx="14" fill="#22c55e"/>
</svg>